; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:sticks3]
platform = espressif32@7.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.arduino.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.f_cpu = 240000000L
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=3
extra_scripts = pre:tools/embed_assets.py
lib_deps = 
	m5stack/M5Unified@^0.2.13
	bblanchon/ArduinoJson@^7.2.0
	ricmoo/QRCode@^0.0.1
monitor_speed = 115200
upload_speed = 1500000

; ---------------------------------------------------------------------------
; M5Cardputer ADV（Stamp-S3A = ESP32-S3FN8，无 PSRAM；240×135 横屏 + TCA8418 键盘）
; 与 sticks3 同一份 src：板型差异集中在 include/board.h（-DBOARD_CARDPUTER=1）。
; 工具链口径照抄已验证的 rain-chamber-cardputer（不钉 platform 版本 → pioarduino）。
; ---------------------------------------------------------------------------
[env:cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.psram = disable          ; ADV 无 PSRAM；本项目不用 ps_malloc
build_flags =
	-DBOARD_CARDPUTER=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=3
extra_scripts = pre:tools/embed_assets.py
lib_deps =
	m5stack/M5Unified@^0.2.13
	m5stack/M5Cardputer@^1.1.1
	bblanchon/ArduinoJson@^7.2.0
	ricmoo/QRCode@^0.0.1
monitor_speed = 115200

